version: '3'

services:
    webapp:
       build: ./
       image: shogoki/drbucur
       
       restart: always
       environment:
              - VIRTUAL_HOST=www.dr-bucur.info,dr-bucur.info,dr-bucur.srv2.evoltuion-web.de
              - LETSENCRYPT_HOST=www.dr-bucur.info,dr-bucur.info
       networks:
              default:
                 aliases:
                    - web
            
              web:
                 aliases:
                    - dr-bucur
  
networks:
        web:
          external:
             name : webproxy

       
